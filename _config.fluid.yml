# Fluid 主题配置
# 文档：https://hexo.fluid-dev.com/docs/

index:
  banner_img_height: 65
  slogan:
    enable: true
    text: 写代码，也写生活

# 个人名片：头像、昵称、简介、社交图标
# 把 avatar / icons 里的图片换成你自己的即可
about:
  enable: true
  banner_img_height: 60
  avatar: /img/avatar.svg
  name: "博主"
  intro: "一个写了几年代码的工程师，目前在做后端。喜欢把踩过的坑记下来。"
  # 加 qrcode 后图标不再是链接，而是悬浮二维码，适合放收款码 / 公众号
  # 图标名必须是 Fluid 内置的，可用列表见 https://hexo.fluid-dev.com/docs/icon/
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/yourname", tip: "GitHub" }
    - { class: "iconfont icon-wechat-fill", qrcode: "/img/wechat-qr.svg", tip: "微信收款码" }

search:
  enable: true

comments:
  enable: false

statistics:
  enable: false

post:
  toc:
    enable: true
  meta:
    author:
      enable: false
    date:
      enable: true
      format: LL

footer:
  statistics:
    enable: false
